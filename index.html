<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ProspectHunt — Find Agencies to Sell Leads To</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:       #0a0a0f;
    --surface:  #111118;
    --border:   #1e1e2e;
    --border2:  #2a2a3e;
    --accent:   #6ee7b7;
    --accent2:  #38bdf8;
    --warn:     #f59e0b;
    --danger:   #f87171;
    --text:     #e2e8f0;
    --muted:    #64748b;
    --muted2:   #475569;
    --card:     #13131f;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Grid background ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(110,231,183,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(110,231,183,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Glow orbs ── */
  body::after {
    content: '';
    position: fixed;
    top: -200px;
    left: -200px;
    width: 600px;
    height: 600px;
    background: radial-gradient(circle, rgba(110,231,183,0.06) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .glow-orb2 {
    position: fixed;
    bottom: -150px;
    right: -150px;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(56,189,248,0.05) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* ── Layout ── */
  .shell {
    position: relative;
    z-index: 1;
    max-width: 1100px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ── Header ── */
  header {
    padding: 36px 0 28px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }

  .logo {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--text);
  }

  .logo span { color: var(--accent); }

  .version-tag {
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border2);
    padding: 3px 10px;
    border-radius: 999px;
    letter-spacing: 0.05em;
  }

  .tagline {
    font-size: 12px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* ── Section titles ── */
  .section-label {
    font-family: 'Syne', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Input grid ── */
  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }

  @media (max-width: 680px) {
    .config-grid { grid-template-columns: 1fr; }
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .field.full { grid-column: 1 / -1; }

  label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }

  input[type="text"], input[type="url"], textarea, select {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    padding: 10px 14px;
    border-radius: 6px;
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
    width: 100%;
    resize: vertical;
  }

  input[type="text"]:focus, input[type="url"]:focus,
  textarea:focus, select:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(110,231,183,0.08);
  }

  textarea { min-height: 72px; }

  select option { background: var(--surface); }

  /* ── Toggle row ── */
  .toggle-row {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }

  .toggle-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 6px;
    padding: 7px 14px;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    user-select: none;
    font-size: 12px;
    color: var(--muted);
  }

  .toggle-chip:hover { border-color: var(--border2); color: var(--text); }

  .toggle-chip input { display: none; }

  .toggle-chip.active {
    border-color: var(--accent);
    background: rgba(110,231,183,0.07);
    color: var(--accent);
  }

  /* ── Buttons ── */
  .btn-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 32px;
  }

  .btn {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    padding: 11px 24px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a0a0f;
  }

  .btn-primary:hover { background: #4ade80; transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }
  .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  .btn-secondary {
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border2);
  }

  .btn-secondary:hover { border-color: var(--muted2); color: var(--text); }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(248,113,113,0.3);
  }

  .btn-danger:hover { background: rgba(248,113,113,0.07); }

  /* ── Status bar ── */
  #statusBar {
    display: none;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px 18px;
    margin-bottom: 24px;
    font-size: 12px;
  }

  #statusBar.visible { display: flex; }

  .pulse-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.7); }
  }

  /* ── Stats row ── */
  #statsRow {
    display: none;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 12px;
    margin-bottom: 24px;
  }

  #statsRow.visible { display: grid; }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 4px;
  }

  .stat-label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── Filter bar ── */
  #filterBar {
    display: none;
    align-items: center;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 20px;
  }

  #filterBar.visible { display: flex; }

  .filter-input {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 6px;
    outline: none;
    width: 220px;
  }

  .filter-input:focus { border-color: var(--accent); }

  .filter-select {
    background: var(--surface);
    border: 1px solid var(--border2);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 12px;
    padding: 7px 12px;
    border-radius: 6px;
    outline: none;
  }

  .results-count {
    margin-left: auto;
    font-size: 12px;
    color: var(--muted);
  }

  /* ── Results grid ── */
  #results {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  /* ── Prospect card ── */
  .prospect-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 18px 20px;
    transition: border-color 0.15s, transform 0.12s;
    animation: slideIn 0.25s ease forwards;
    opacity: 0;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .prospect-card:hover {
    border-color: var(--border2);
    transform: translateY(-1px);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 10px;
  }

  .card-title {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: var(--text);
    line-height: 1.3;
    flex: 1;
  }

  .card-title a {
    color: inherit;
    text-decoration: none;
  }

  .card-title a:hover { color: var(--accent); }

  .score-badge {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 13px;
    padding: 3px 10px;
    border-radius: 5px;
    flex-shrink: 0;
  }

  .score-hot  { background: rgba(110,231,183,0.15); color: var(--accent); border: 1px solid rgba(110,231,183,0.3); }
  .score-warm { background: rgba(245,158,11,0.12);  color: var(--warn);   border: 1px solid rgba(245,158,11,0.3);  }
  .score-cold { background: rgba(100,116,139,0.12); color: var(--muted);  border: 1px solid var(--border2); }

  .card-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 10px;
  }

  .meta-chip {
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 4px;
    letter-spacing: 0.03em;
  }

  .chip-sub   { background: rgba(56,189,248,0.1);  color: var(--accent2); border: 1px solid rgba(56,189,248,0.2); }
  .chip-type  { background: rgba(100,116,139,0.12); color: var(--muted);  border: 1px solid var(--border2); }
  .chip-stage { background: rgba(110,231,183,0.08); color: var(--accent); border: 1px solid rgba(110,231,183,0.2); }
  .chip-warn  { background: rgba(245,158,11,0.1);   color: var(--warn);   border: 1px solid rgba(245,158,11,0.2); }
  .chip-user  { background: rgba(168,85,247,0.1);   color: #c084fc;       border: 1px solid rgba(168,85,247,0.2); }

  .card-body {
    font-size: 13px;
    color: var(--muted);
    line-height: 1.6;
    margin-bottom: 12px;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .outreach-box {
    background: rgba(110,231,183,0.05);
    border: 1px solid rgba(110,231,183,0.15);
    border-radius: 6px;
    padding: 10px 14px;
    margin-bottom: 12px;
    font-size: 12px;
    color: var(--accent);
    font-style: italic;
  }

  .outreach-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 4px;
    font-style: normal;
  }

  .card-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .btn-sm {
    font-size: 11px;
    padding: 5px 12px;
    border-radius: 4px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.12s;
    font-family: 'DM Mono', monospace;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }

  .btn-sm:hover { color: var(--text); border-color: var(--muted2); }

  .btn-sm-accent {
    border-color: rgba(110,231,183,0.3);
    color: var(--accent);
  }

  .btn-sm-accent:hover { background: rgba(110,231,183,0.07); }

  /* ── Empty / loading states ── */
  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }

  .empty-state .icon {
    font-size: 40px;
    margin-bottom: 16px;
    display: block;
  }

  .empty-state h3 {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    color: var(--text);
    margin-bottom: 8px;
  }

  /* ── Export bar ── */
  #exportBar {
    display: none;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  #exportBar.visible { display: flex; }

  /* ── Toast ── */
  #toast {
    position: fixed;
    bottom: 28px;
    right: 28px;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 12px 20px;
    font-size: 13px;
    color: var(--text);
    z-index: 999;
    transform: translateY(20px);
    opacity: 0;
    transition: all 0.2s;
    pointer-events: none;
  }

  #toast.show { transform: translateY(0); opacity: 1; }

  /* ── ICP preview box ── */
  #icpBox {
    display: none;
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 8px;
    padding: 14px 18px;
    margin-bottom: 20px;
    font-size: 12px;
    color: var(--muted);
    line-height: 1.7;
  }

  #icpBox.visible { display: block; }
  #icpBox strong { color: var(--accent); font-weight: 500; }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>
<div class="glow-orb2"></div>
<div class="shell">

  <!-- Header -->
  <header>
    <div>
      <div class="logo">Prospect<span>Hunt</span></div>
      <div class="tagline">Find agencies & startups to sell leads to — powered by Reddit</div>
    </div>
    <div class="version-tag">v1.0 · PRIVATE</div>
  </header>

  <!-- Config section -->
  <div class="section-label">Target Profile</div>

  <div class="config-grid">
    <div class="field full">
      <label>Who are you looking to sell to?</label>
      <textarea id="targetDesc" placeholder="e.g. New marketing agencies, SaaS startups that just launched, founders building their first product and need customers, people who just started an outreach agency..."></textarea>
    </div>

    <div class="field">
      <label>Time Window</label>
      <select id="timeWindow">
        <option value="week">Past Week (freshest)</option>
        <option value="month" selected>Past Month</option>
        <option value="year">Past Year</option>
      </select>
    </div>

    <div class="field">
      <label>Max Prospects</label>
      <select id="maxResults">
        <option value="50">50 prospects</option>
        <option value="100" selected>100 prospects</option>
        <option value="200">200 prospects</option>
        <option value="400">400 prospects</option>
      </select>
    </div>

    <div class="field">
      <label>Min Prospect Score</label>
      <select id="minScore">
        <option value="3">3+ (broad net)</option>
        <option value="5" selected>5+ (balanced)</option>
        <option value="7">7+ (high intent only)</option>
      </select>
    </div>

    <div class="field">
      <label>Mode</label>
      <select id="deepMode">
        <option value="false" selected>Standard</option>
        <option value="true">Deep (slower, more results)</option>
      </select>
    </div>
  </div>

  <!-- Filters -->
  <div class="section-label">Prospect Type Filter</div>
  <div class="toggle-row" id="typeFilters">
    <label class="toggle-chip active" data-val="new_agency">
      <input type="checkbox" checked /> 🏢 New Agency
    </label>
    <label class="toggle-chip active" data-val="new_saas">
      <input type="checkbox" checked /> 🚀 New SaaS / Product
    </label>
    <label class="toggle-chip active" data-val="needs_customers">
      <input type="checkbox" checked /> 🎯 Needs Customers
    </label>
    <label class="toggle-chip active" data-val="needs_leads">
      <input type="checkbox" checked /> 🔥 Needs Leads
    </label>
    <label class="toggle-chip active" data-val="just_launched">
      <input type="checkbox" checked /> ⚡ Just Launched
    </label>
    <label class="toggle-chip" data-val="looking_for_growth">
      <input type="checkbox" /> 📈 Looking for Growth
    </label>
  </div>

  <!-- Actions -->
  <div class="btn-row">
    <button class="btn btn-primary" id="huntBtn" onclick="startHunt()">
      <span>⚡</span> Hunt Prospects
    </button>
    <button class="btn btn-secondary" id="rawBtn" onclick="rawScan()">
      🔍 Raw Scan (no AI)
    </button>
    <button class="btn btn-secondary" onclick="previewPlan()">
      🗺 Keyword Plan
    </button>
    <button class="btn btn-secondary" onclick="clearResults()">
      ✕ Clear
    </button>
  </div>

  <!-- Status -->
  <div id="statusBar">
    <div class="pulse-dot"></div>
    <span id="statusText">Scanning Reddit for prospects...</span>
  </div>

  <!-- ICP box -->
  <div id="icpBox"></div>

  <!-- Stats -->
  <div id="statsRow">
    <div class="stat-card">
      <div class="stat-num" id="statTotal">0</div>
      <div class="stat-label">Scraped</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statAnalyzed">0</div>
      <div class="stat-label">Analyzed</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statProspects">0</div>
      <div class="stat-label">Prospects Found</div>
    </div>
    <div class="stat-card">
      <div class="stat-num" id="statHot">0</div>
      <div class="stat-label">High Intent</div>
    </div>
  </div>

  <!-- Filter bar -->
  <div id="filterBar">
    <input class="filter-input" type="text" id="searchFilter" placeholder="Search prospects..." oninput="renderFiltered()" />
    <select class="filter-select" id="sortFilter" onchange="renderFiltered()">
      <option value="score">Sort: Score</option>
      <option value="urgency">Sort: Urgency</option>
      <option value="recent">Sort: Recent</option>
    </select>
    <select class="filter-select" id="typeFilter" onchange="renderFiltered()">
      <option value="">All Types</option>
      <option value="new_agency">New Agency</option>
      <option value="new_saas">New SaaS</option>
      <option value="needs_customers">Needs Customers</option>
      <option value="needs_leads">Needs Leads</option>
      <option value="just_launched">Just Launched</option>
    </select>
    <span class="results-count" id="filteredCount"></span>
  </div>

  <!-- Results -->
  <div id="results">
    <div class="empty-state">
      <span class="icon">🎯</span>
      <h3>No prospects yet</h3>
      <p>Describe who you want to sell leads to, then hit Hunt Prospects.</p>
    </div>
  </div>

  <!-- Export -->
  <div id="exportBar">
    <button class="btn btn-secondary" onclick="exportCSV()">📥 Export CSV</button>
    <button class="btn btn-secondary" onclick="exportJSON()">📋 Export JSON</button>
    <span style="color:var(--muted);font-size:12px;" id="exportCount"></span>
  </div>

</div>

<!-- Toast -->
<div id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const BACKEND = "https://leadfinder.adpandeys35.workers.dev";

// ─── State ────────────────────────────────────────────────────────────────────
let allProspects = [];
let rawPosts     = [];
let viewMode     = 'prospects'; // 'prospects' | 'raw'
let isHunting    = false;

// ─── Toggle chips ─────────────────────────────────────────────────────────────
document.querySelectorAll('.toggle-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    chip.classList.toggle('active');
    const cb = chip.querySelector('input');
    if (cb) cb.checked = chip.classList.contains('active');
  });
});

// ─── Raw Scan — NO AI, just shows what Reddit returns ─────────────────────────
async function rawScan() {
  const desc = document.getElementById('targetDesc').value.trim();
  if (!desc) { toast('Enter a target description first'); return; }
  if (isHunting) return;

  isHunting = true;
  const btn = document.getElementById('rawBtn');
  btn.disabled = true;
  btn.textContent = '⏳ Scanning...';

  showStatus('Fetching raw Reddit posts (no AI)...');
  document.getElementById('statsRow').classList.remove('visible');
  document.getElementById('filterBar').classList.remove('visible');
  document.getElementById('exportBar').classList.remove('visible');

  try {
    const res = await fetch(`${BACKEND}/api/raw`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        business_description: desc,
        time_window: document.getElementById('timeWindow').value,
        max_results: 50,
        deep_mode: false,
      }),
    });

    if (!res.ok) throw new Error(`Worker ${res.status}: ${await res.text()}`);
    const data = await res.json();

    rawPosts  = data.posts || [];
    viewMode  = 'raw';
    allProspects = rawPosts; // reuse same render pipeline

    document.getElementById('statTotal').textContent    = (data.total_scraped || 0).toLocaleString();
    document.getElementById('statAnalyzed').textContent = rawPosts.length;
    document.getElementById('statProspects').textContent = rawPosts.length;
    document.getElementById('statHot').textContent      = rawPosts.filter(p => (p.heuristic_score||0) >= 50).length;
    document.getElementById('statsRow').classList.add('visible');

    if (data.keywords_used) {
      document.getElementById('icpBox').innerHTML =
        `<strong>🔍 Raw Scan Mode</strong> — showing unfiltered Reddit posts<br>` +
        `<strong>Keywords used:</strong> ${data.keywords_used.slice(0,10).join(', ')}...<br>` +
        `<strong>Note:</strong> ${data.note || ''}`;
      document.getElementById('icpBox').classList.add('visible');
    }

    if (rawPosts.length) {
      document.getElementById('filterBar').classList.add('visible');
      document.getElementById('exportBar').classList.add('visible');
      renderFiltered();
      toast(`🔍 Raw scan: ${rawPosts.length} posts found`);
    } else {
      document.getElementById('results').innerHTML = `
        <div class="empty-state">
          <span class="icon">😶</span>
          <h3>Reddit returned 0 posts</h3>
          <p>Reddit may be rate limiting the worker. Try again in 30 seconds.</p>
        </div>`;
    }
  } catch(e) {
    toast(`❌ ${e.message}`, true);
    document.getElementById('results').innerHTML = `<div class="empty-state"><span class="icon">⚠️</span><h3>${e.message}</h3></div>`;
  } finally {
    isHunting = false;
    btn.disabled = false;
    btn.textContent = '🔍 Raw Scan (no AI)';
    hideStatus();
  }
}

// ─── Hunt ─────────────────────────────────────────────────────────────────────
async function startHunt() {
  const desc = document.getElementById('targetDesc').value.trim();
  if (!desc) { toast('Describe who you want to target first'); return; }
  if (isHunting) return;

  isHunting = true;
  viewMode  = 'prospects';
  const btn = document.getElementById('huntBtn');
  btn.disabled = true;
  btn.innerHTML = '<span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#0a0a0f;animation:pulse 1.2s infinite"></span> Hunting...';

  showStatus('Analyzing your target profile...');
  document.getElementById('statsRow').classList.remove('visible');
  document.getElementById('filterBar').classList.remove('visible');
  document.getElementById('exportBar').classList.remove('visible');
  document.getElementById('icpBox').classList.remove('visible');

  const activeTypes = [...document.querySelectorAll('.toggle-chip.active')].map(c => c.dataset.val);

  const payload = {
    business_description: desc,
    time_window:     document.getElementById('timeWindow').value,
    max_results:     parseInt(document.getElementById('maxResults').value),
    filter_min_lead: parseInt(document.getElementById('minScore').value),
    deep_mode:       document.getElementById('deepMode').value === 'true',
    include_comments: true,
    prospect_types:  activeTypes,
  };

  try {
    showStatus('Scanning Reddit + running AI analysis...');
    const res = await fetch(`${BACKEND}/api/scrape`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    if (!res.ok) throw new Error(`Worker ${res.status}: ${await res.text()}`);
    const data = await res.json();

    allProspects = data.leads || [];
    rawPosts     = data.raw_preview || [];

    document.getElementById('statTotal').textContent     = (data.total_scraped || 0).toLocaleString();
    document.getElementById('statAnalyzed').textContent  = (data.total_analyzed || 0).toLocaleString();
    document.getElementById('statProspects').textContent = allProspects.length;
    document.getElementById('statHot').textContent       = allProspects.filter(p => (p.lead_score||0) >= 7).length;
    document.getElementById('statsRow').classList.add('visible');

    // Build ICP box — always show keywords + raw preview info
    let icpHtml = '';
    if (data.icp) icpHtml += `<strong>🎯 ICP:</strong> ${escHtml(data.icp)}<br>`;
    if (data.keywords_used) icpHtml += `<strong>Keywords:</strong> ${data.keywords_used.slice(0,8).join(', ')}...<br>`;
    if (data.used_fallback) icpHtml += `<span style="color:var(--warn)">⚠️ AI returned 0 — showing heuristic fallback matches. Try Raw Scan to see what was found.</span><br>`;
    if (rawPosts.length && allProspects.length === 0) {
      icpHtml += `<span style="color:var(--warn)">ℹ️ Reddit found ${rawPosts.length} posts but AI filtered them all. Showing top raw posts below instead.</span>`;
    }
    if (icpHtml) {
      document.getElementById('icpBox').innerHTML = icpHtml;
      document.getElementById('icpBox').classList.add('visible');
    }

    // If AI gave 0, show raw posts so user always sees something
    if (allProspects.length === 0 && rawPosts.length > 0) {
      allProspects = rawPosts.map(p => ({
        ...p,
        lead_score: Math.min(Math.round((p.heuristic_score||0) / 8), 9),
        prospect_type: 'unclassified',
        urgency: 'medium',
        decision_stage: 'researching',
        contact_ok: true,
        outreach_angle: 'Saw your Reddit post — we find high-intent leads for businesses. Want a free sample?',
        _raw_fallback: true,
      }));
    }

    if (allProspects.length) {
      document.getElementById('filterBar').classList.add('visible');
      document.getElementById('exportBar').classList.add('visible');
      renderFiltered();
      const label = data.used_fallback || allProspects.some(p => p._raw_fallback)
        ? `⚡ ${allProspects.length} posts shown (heuristic mode — check Raw Scan)`
        : `✅ Found ${allProspects.length} prospects!`;
      toast(label);
    } else {
      document.getElementById('results').innerHTML = `
        <div class="empty-state">
          <span class="icon">😶</span>
          <h3>No prospects found</h3>
          <p>Try clicking <strong>🔍 Raw Scan</strong> to see if Reddit is returning posts at all.</p>
          ${data.message ? `<p style="margin-top:8px;font-size:11px;color:var(--muted2)">${escHtml(data.message)}</p>` : ''}
        </div>`;
    }

  } catch(e) {
    console.error(e);
    toast(`❌ ${e.message}`, true);
    document.getElementById('results').innerHTML = `
      <div class="empty-state"><span class="icon">⚠️</span><h3>Error</h3><p>${escHtml(e.message)}</p></div>`;
  } finally {
    isHunting = false;
    btn.disabled = false;
    btn.innerHTML = '<span>⚡</span> Hunt Prospects';
    hideStatus();
  }
}

// ─── Preview plan ──────────────────────────────────────────────────────────────
async function previewPlan() {
  const desc = document.getElementById('targetDesc').value.trim();
  if (!desc) { toast('Enter a target description first'); return; }
  showStatus('Generating keyword plan...');
  try {
    const res  = await fetch(`${BACKEND}/api/plan`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ business_description: desc }),
    });
    const data = await res.json();
    document.getElementById('icpBox').innerHTML =
      `<strong>🗺 Keyword Plan</strong><br>` +
      `<strong>ICP:</strong> ${escHtml(data.icp || 'N/A')}<br>` +
      `<strong>Keywords (${(data.searchKeywords||[]).length}):</strong> ${(data.searchKeywords||[]).join(', ')}<br>` +
      `<strong>Subreddits:</strong> r/${(data.targetSubreddits||[]).join(', r/')}`;
    document.getElementById('icpBox').classList.add('visible');
    toast('Plan ready ↑');
  } catch(e) {
    toast(`Error: ${e.message}`, true);
  } finally { hideStatus(); }
}

// ─── Render ────────────────────────────────────────────────────────────────────
function renderFiltered() {
  const search = document.getElementById('searchFilter').value.toLowerCase();
  const sort   = document.getElementById('sortFilter').value;
  const typeF  = document.getElementById('typeFilter').value;

  let filtered = allProspects.filter(p => {
    if (typeF && p.prospect_type !== typeF && !p._raw_fallback) return false;
    if (search) {
      const hay = ((p.title||'')+(p.body||'')+(p.author||'')+(p.subreddit||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });

  if (sort === 'score')   filtered.sort((a,b) => ((b.lead_score||b.heuristic_score||0)) - ((a.lead_score||a.heuristic_score||0)));
  if (sort === 'urgency') filtered.sort((a,b) => urgencyVal(b.urgency) - urgencyVal(a.urgency));
  if (sort === 'recent')  filtered.sort((a,b) => new Date(b.created_at||0) - new Date(a.created_at||0));

  document.getElementById('filteredCount').textContent = `${filtered.length} results`;
  document.getElementById('exportCount').textContent   = `${filtered.length} ready to export`;

  if (!filtered.length) {
    document.getElementById('results').innerHTML = `<div class="empty-state"><span class="icon">🔍</span><h3>No matches</h3><p>Try adjusting filters.</p></div>`;
    return;
  }

  document.getElementById('results').innerHTML = filtered.map((p, i) => buildCard(p, i)).join('');
}

function urgencyVal(u) { return u === 'high' ? 3 : u === 'medium' ? 2 : 1; }

function buildCard(p, idx) {
  const isRaw   = p._raw_fallback || p.heuristic_score != null;
  const score   = p.lead_score || (isRaw ? Math.min(Math.round((p.heuristic_score||0)/8),9) : 0);
  const scoreClass = score >= 7 ? 'score-hot' : score >= 4 ? 'score-warm' : 'score-cold';
  const scoreLabel = score >= 7 ? '🔥 ' + score : score >= 4 ? '⚡ ' + score : '· ' + score;

  const stageMap = { ready_to_buy:'💰 Ready to Buy', evaluating:'🤔 Evaluating', researching:'🔍 Researching', awareness:'👀 Awareness' };
  const typeMap  = { new_agency:'🏢 New Agency', new_saas:'🚀 New SaaS', needs_customers:'🎯 Needs Customers', needs_leads:'🔥 Needs Leads', just_launched:'⚡ Just Launched', looking_for_growth:'📈 Growth', unclassified:'📄 Raw Post' };

  const stageLabel = stageMap[p.decision_stage] || '';
  const typeLabel  = typeMap[p.intent || p.prospect_type] || p.prospect_type || '';

  const postUrl = p.url || 'https://reddit.com';
  const userUrl = p.author ? `https://reddit.com/u/${p.author}` : null;
  const title   = (p.title || 'Untitled post').slice(0, 120);
  const body    = (p.body  || '').slice(0, 280);
  const delay   = Math.min(idx * 0.035, 1.2);

  return `
  <div class="prospect-card" style="animation-delay:${delay}s${isRaw && !p.lead_score ? ';border-color:rgba(245,158,11,0.2)' : ''}">
    <div class="card-top">
      <div class="card-title"><a href="${postUrl}" target="_blank" rel="noopener">${escHtml(title)}</a></div>
      <div class="score-badge ${scoreClass}">${scoreLabel}</div>
    </div>
    <div class="card-meta">
      <span class="meta-chip chip-sub">r/${escHtml(p.subreddit||'?')}</span>
      <span class="meta-chip chip-type">${p.type||'post'}</span>
      ${typeLabel  ? `<span class="meta-chip chip-stage">${typeLabel}</span>` : ''}
      ${stageLabel ? `<span class="meta-chip chip-warn">${stageLabel}</span>` : ''}
      ${p.urgency === 'high' ? `<span class="meta-chip chip-warn">🚨 Urgent</span>` : ''}
      ${p.budget_signal ? `<span class="meta-chip chip-warn">💵 Budget</span>` : ''}
      ${p.contact_ok    ? `<span class="meta-chip chip-stage">✉️ Open to DM</span>` : ''}
      ${isRaw && !p.lead_score ? `<span class="meta-chip" style="background:rgba(245,158,11,0.1);color:var(--warn);border:1px solid rgba(245,158,11,0.2)">🔍 Raw · ${p.heuristic_score||0}pts</span>` : ''}
      ${userUrl ? `<a class="meta-chip chip-user" href="${userUrl}" target="_blank">u/${escHtml(p.author||'anon')}</a>` : ''}
    </div>
    ${body ? `<div class="card-body">${escHtml(body)}</div>` : ''}
    ${p.outreach_angle ? `<div class="outreach-box"><div class="outreach-label">💬 Outreach Angle</div>${escHtml(p.outreach_angle)}</div>` : ''}
    ${p.pain_summary ? `<div style="font-size:12px;color:var(--muted);margin-bottom:10px;font-style:italic">🩹 ${escHtml(p.pain_summary)}</div>` : ''}
    <div class="card-actions">
      <a class="btn-sm btn-sm-accent" href="${postUrl}" target="_blank" rel="noopener">↗ View Post</a>
      ${userUrl ? `<a class="btn-sm" href="${userUrl}" target="_blank" rel="noopener">👤 Profile</a>` : ''}
      <button class="btn-sm" onclick="copyPitch(this, ${idx})">📋 Copy Pitch</button>
      ${p.why_lead ? `<button class="btn-sm" onclick="toast('💡 '+${JSON.stringify(p.why_lead)})">💡 Why?</button>` : ''}
    </div>
  </div>`;
}

function copyPitch(btn, idx) {
  const filtered = getFiltered();
  const p = filtered[idx];
  if (!p) return;
  const text = p.outreach_angle
    ? `Hi u/${p.author}, ${p.outreach_angle}

Ref: ${p.url}`
    : `Hi u/${p.author}, saw your Reddit post and thought you might be interested in our lead gen service.

${p.url}`;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = '✅ Copied!';
    setTimeout(() => { btn.textContent = '📋 Copy Pitch'; }, 2000);
  });
}

function getFiltered() {
  const search = document.getElementById('searchFilter').value.toLowerCase();
  const typeF  = document.getElementById('typeFilter').value;
  return allProspects.filter(p => {
    if (typeF && p.prospect_type !== typeF && !p._raw_fallback) return false;
    if (search) {
      const hay = ((p.title||'')+(p.body||'')+(p.author||'')+(p.subreddit||'')).toLowerCase();
      if (!hay.includes(search)) return false;
    }
    return true;
  });
}

// ─── Export ───────────────────────────────────────────────────────────────────
function exportCSV() {
  const list = getFiltered();
  if (!list.length) { toast('No results to export'); return; }
  const headers = ['score','author','subreddit','type','prospect_type','urgency','stage','budget','contact','title','url','outreach_angle','why'];
  const rows = list.map(p => [
    p.lead_score || p.heuristic_score || 0, p.author, p.subreddit, p.type,
    p.prospect_type, p.urgency, p.decision_stage,
    p.budget_signal ? 'yes' : 'no', p.contact_ok ? 'yes' : 'no',
    '"'+(p.title||'').replace(/"/g,'""')+'"', p.url,
    '"'+(p.outreach_angle||'').replace(/"/g,'""')+'"',
    '"'+(p.why_lead||'').replace(/"/g,'""')+'"',
  ]);
  const csv = [headers, ...rows].map(r => r.join(',')).join('
');
  download('prospects_'+Date.now()+'.csv', csv, 'text/csv');
  toast(`📥 Exported ${list.length} rows`);
}

function exportJSON() {
  const list = getFiltered();
  if (!list.length) { toast('No results to export'); return; }
  download('prospects_'+Date.now()+'.json', JSON.stringify(list, null, 2), 'application/json');
  toast(`📋 Exported ${list.length} as JSON`);
}

function download(name, content, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content], { type }));
  a.download = name; a.click();
}

function clearResults() {
  allProspects = []; rawPosts = [];
  document.getElementById('results').innerHTML = `<div class="empty-state"><span class="icon">🎯</span><h3>No prospects yet</h3><p>Describe who you want to sell leads to, then hit Hunt Prospects.</p></div>`;
  ['statsRow','filterBar','exportBar','icpBox'].forEach(id => document.getElementById(id).classList.remove('visible'));
}

function showStatus(msg) {
  document.getElementById('statusText').textContent = msg;
  document.getElementById('statusBar').classList.add('visible');
}
function hideStatus() { document.getElementById('statusBar').classList.remove('visible'); }
function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function toast(msg, isErr=false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.borderColor = isErr ? 'rgba(248,113,113,0.4)' : '';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3500);
}
</script>
</body>
